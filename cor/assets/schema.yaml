# Cor Metadata Schema
# Defines valid values for all frontmatter fields

common:
  created:
    type: date
    format: YYYY-MM-DD HH:MM
    description: Datetime file was created
    auto: true  # Set automatically by `cor new`

  modified:
    type: date
    format: YYYY-MM-DD HH:MM
    description: Datetime file was last modified
    auto: true  # Updated by git pre-commit hook

  tags:
    type: list
    items: string
    description: Freeform tags for categorization

  due:
    type: date
    format: YYYY-MM-DD or YYYY-MM-DD HH:MM
    description: Deadline for completion (time is optional - include for calendar events at specific times)
    optional: true

  priority:
    type: enum
    values: [low, medium, high]
    description: Urgency level
    optional: true

project:
  status:
    type: enum
    values: [planning, active, paused, done]
    default: planning
    description: |
      planning  - Defining goals/scope
      active    - Currently being worked on
      paused    - Temporarily on hold
      done  - Done, goals achieved

  requires:
    type: list
    items: string
    description: List of task/project stems this project requires (soft dependencies)
    optional: true

  continues:
    type: list
    items: string
    description: |
      Stems of projects this project continues (predecessors). Used when a
      finished project is picked up again as new work instead of being
      resurrected from the archive. The inverse (`continued_by`) is not
      stored - it is computed by scanning, like `blocks` is from `requires`.
    optional: true

  related:
    type: list
    items: string
    description: |
      Stems of related notes. Symmetric: storing it on either side is enough,
      queries return the union of both directions.
    optional: true

task:
  type:
    type: const
    value: task

  status:
    type: enum
    values: [todo, active, blocked, done, dropped, waiting]
    default: todo
    description: |
      todo    - Ready to start
      active  - Currently in progress
      blocked - Waiting on something
      done    - Completed
      dropped - Cancelled/abandoned
      waiting - Active but external (someone/something else work)

  requires:
    type: list
    items: string
    description: List of task/project stems this task requires (soft dependencies)
    optional: true

  related:
    type: list
    items: string
    description: Stems of related notes (symmetric, non-directional)
    optional: true
note:
  type:
    type: const
    value: note

  related:
    type: list
    items: string
    description: Stems of related notes (symmetric, non-directional)
    optional: true
